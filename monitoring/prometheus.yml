global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'backend'
    static_configs:
      - targets: ['backend--${ENVIRONMENT}:5000']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'frontend'
    static_configs:
      - targets: ['frontend--${ENVIRONMENT}:3000']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'mysql'
    static_configs:
      - targets: ['database--${ENVIRONMENT}:3306']

  - job_name: 'node_exporters'
    static_configs:
      - targets:
          - '<PRIVATE_IP_FRONTEND>:9100'
          - '<PRIVATE_IP_BACKEND>:9100'
          - '<PRIVATE_IP_DB>:9100'
          - '<PRIVATE_IP_REVERSE_PROXY>:9100'
          - 'localhost:9100'

