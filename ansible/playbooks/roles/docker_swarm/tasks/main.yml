---
- name: Check if swarm is initialised
  ansible.builtin.command: docker node ls
  register: swarm_status
  changed_when: false
  failed_when: false

- name: Set swarm status fact
  ansible.builtin.set_fact:
    swarm_active: "{{ swarm_status.rc == 0 }}"

- name: Leave existing swarm (force all nodes)
  ansible.builtin.command: docker swarm leave --force
  ignore_errors: true

- name: Initialize Docker Swarm on manager-1
  ansible.builtin.command: docker swarm init --advertise-addr {{ ansible_default_ipv4.address }} --force-new-cluster
  when: inventory_hostname == groups['swarm_managers'][0]
  register: swarm_init_result

- name: Wait for swarm to be ready
  pause:
    seconds: 5
  when: inventory_hostname == groups['swarm_managers'][0]

- name: "Get manager join token"
  shell: docker swarm join-token manager -q
  register: manager_token
  delegate_to: "{{ groups['swarm_managers'][0] }}"
  run_once: true
  
- name: "Get worker join token"
  shell: docker swarm join-token worker -q
  register: worker_token
  delegate_to: "{{ groups['swarm_managers'][0] }}"
  run_once: true

- name: Check if node is already in the swarm (for all)
  shell: docker info --format '{{ "{{ .Swarm.LocalNodeState }}" }}'
  register: swarm_state
  changed_when: false
  failed_when: false

- name: "Join managers "
  shell: >
    docker swarm join 
    --token {{ hostvars[groups['swarm_managers'][0]]['manager_token']['stdout'] }}
    {{ hostvars[groups['swarm_managers'][0]]['ansible_default_ipv4']['address'] }}:2377
  when:
    - inventory_hostname in groups['swarm_managers']
    - inventory_hostname != groups['swarm_managers'][0]
    - hostvars[groups['swarm_managers'][0]]['manager_token']['stdout'] is defined
  register: manager_join_result
  failed_when: 
    - manager_join_result.rc != 0
    - "'already part of a swarm' not in manager_join_result.stderr"

- name: "Join Workers "
  shell: >
    docker swarm join 
    --token {{ hostvars[groups['swarm_managers'][0]]['worker_token']['stdout'] }}
    {{ hostvars[groups['swarm_managers'][0]]['ansible_default_ipv4']['address'] }}:2377
  when:
    - inventory_hostname in groups['swarm_workers'] | default([])
    - hostvars[groups['swarm_managers'][0]]['worker_token']['stdout'] is defined
  register: worker_join_result
  failed_when: 
    - worker_join_result.rc != 0
    - "'already part of a swarm' not in worker_join_result.stderr"

# CONFIGURATION AVANCÉE (Leader Only)
- name: Create application networks
  docker_network:
    name: "{{ item }}"
    driver: overlay
    attachable: yes
  loop:
    - app_network
    - traefik-public
    - monitoring_network
  when: inventory_hostname == groups['swarm_managers'][0]

- name: Create Docker volumes for persistence
  docker_volume:
    name: "{{ item }}"
    driver: local
  loop:
    - mysql_data
    - prometheus_data
    - grafana_data
  when: inventory_hostname == groups['swarm_managers'][0]


- name: Get current node hostname for all managers
  shell: hostname
  register: node_hostname
  when: inventory_hostname in groups['swarm_managers']

- name: Label manager node for services
  shell: docker node update --label-add {{ item }}=true {{ node_hostname.stdout }}
  loop:
    - traefik.enable
    - monitoring.enable
    - database.allowed
  when: 
    - inventory_hostname in groups['swarm_managers']
    - node_hostname.stdout is defined
  delegate_to: "{{ groups['swarm_managers'][0] }}"

- name: Check applied labels on all managers
  shell: docker node inspect {{ hostvars[item]['node_hostname']['stdout'] }} --format '{% raw %}{{.Spec.Labels}}{% endraw %}'
  register: node_labels
  loop: "{{ groups['swarm_managers'] }}"
  when: 
    - inventory_hostname == groups['swarm_managers'][0]
    - hostvars[item]['node_hostname']['stdout'] is defined

- name: Print node labels for all managers
  debug:
    msg: "Labels sur {{ hostvars[item]['node_hostname']['stdout'] }}: {{ hostvars[item]['node_labels']['stdout'] | default('N/A') }}"
  loop: "{{ groups['swarm_managers'] }}"
  when: 
    - inventory_hostname == groups['swarm_managers'][0]
    - hostvars[item]['node_hostname']['stdout'] is defined

- name: Docker login sur les nodes Swarm
  community.docker.docker_login:
    username: "{{ docker_hub_username }}"
    password: "{{ docker_hub_password }}"
  no_log: true

