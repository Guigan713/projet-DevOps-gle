---
- name: Initialize Swarm on first manager
  block:
    - name: Check if Swarm is initialized
      command: docker info --format '{{ "{{" }}.Swarm.LocalNodeState{{ "}}" }}'
      register: swarm_status
      changed_when: false

    - name: Initialize Docker Swarm
      command: docker swarm init --advertise-addr {{ ansible_default_ipv4.address }}
      when: 
        - inventory_hostname == groups['swarm_managers'][0]
        - swarm_status.stdout != "active"
      register: swarm_init

    - name: Get manager token
      command: docker swarm join-token manager -q
      register: manager_token

    - name: Get worker token  
      command: docker swarm join-token worker -q
      register: worker_token

    - name: Store tokens
      set_fact:
        swarm_manager_token: "{{ manager_token.stdout }}"
        swarm_worker_token: "{{ worker_token.stdout }}"
        swarm_leader_ip: "{{ ansible_default_ipv4.address }}"
  when: inventory_hostname == groups['swarm_managers'][0]

- name: Check if node is already in the swarm (for all)
  shell: docker info --format '{{ "{{ .Swarm.LocalNodeState }}" }}'
  register: swarm_state
  changed_when: false
  failed_when: false

- name: Join additional managers
  command: >
    docker swarm join
    --token {{ hostvars[groups['swarm_managers'][0]]['swarm_manager_token'] }}
    {{ hostvars[groups['swarm_managers'][0]]['swarm_leader_ip'] }}:2377
  when: 
    - inventory_hostname in groups['swarm_managers']
    - inventory_hostname != groups['swarm_managers'][0]
    - swarm_state.stdout != "active"
  ignore_errors: yes

- name: Join workers
  command: >
    docker swarm join
    --token {{ hostvars[groups['swarm_managers'][0]]['swarm_worker_token'] }}
    {{ hostvars[groups['swarm_managers'][0]]['swarm_leader_ip'] }}:2377
  when: 
    - "'swarm_workers' in groups and (groups['swarm_workers'] | length > 0) and inventory_hostname in groups['swarm_workers']"
    - swarm_state.stdout != "active"
  ignore_errors: no


# CONFIGURATION AVANCÉE (Leader Only)
- name: Create application networks
  docker_network:
    name: "{{ item }}"
    driver: overlay
    attachable: yes
  loop:
    - app_network
    - traefik-public
    - monitoring_network
  when: inventory_hostname == groups['swarm_managers'][0]

- name: Create Docker volumes for persistence
  docker_volume:
    name: "{{ item }}"
    driver: local
  loop:
    - mysql_data
    - prometheus_data
    - grafana_data
  when: inventory_hostname == groups['swarm_managers'][0]

- name: Get manager node hostname
  shell: |
    {% raw %}
    docker node ls --format "{{.Hostname}}" --filter "role=manager" | head -1
    {% endraw %}
  register: manager_hostname
  when: inventory_hostname == groups['swarm_managers'][0]

- name: Label manager node for specific services
  shell: docker node update --label-add {{ item }}=true {{ manager_hostname.stdout }}
  loop:
    - traefik.enable
    - monitoring.enable
  when: 
    - inventory_hostname == groups['swarm_managers'][0]
    - manager_hostname.stdout is defined


