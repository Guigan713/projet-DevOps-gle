---
# Version de node_exporter à installer
node_exporter_version: "1.7.0"
node_exporter_binary_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"

# Configuration utilisateur
node_exporter_user: "node_exporter"
node_exporter_group: "node_exporter"
node_exporter_shell: "/bin/false"
node_exporter_home: "/home/node_exporter"

# Configuration service
node_exporter_port: 9100
node_exporter_binary_path: "/usr/local/bin/node_exporter"
node_exporter_config_dir: "/etc/node_exporter"
node_exporter_log_level: "info"

# Collecteurs à activer/désactiver
node_exporter_enabled_collectors:
  - systemd
  - textfile
  - processes
  - interrupts
  - tcpstat
  - conntrack

node_exporter_disabled_collectors:
  - mdadm
  - zfs
  - powersupplyclass

node_exporter_textfile_dir: /var/lib/node_exporter/textfile_collector
