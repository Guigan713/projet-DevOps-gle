- name: Create frontend archive locally
  archive:
    path: "{{ project_root }}/frontend"
    dest: "/tmp/frontend.tar.gz"
    format: gz
  delegate_to: localhost
  run_once: true
  tags:
    - frontend

- name: Copy frontend archive to server
  copy:
    src: "/tmp/frontend.tar.gz"
    dest: "/tmp/frontend.tar.gz"
  tags:
    - frontend

- name: Create Frontend Directory
  ansible.builtin.file:
    path: /home/guillaume/frontend
    state: directory
    owner: guillaume
    group: guillaume
    mode: u=rwX,g=rX,o=rX
  become: yes

- name: Extract frontend files
  unarchive:
    src: "/tmp/frontend.tar.gz"
    dest: "/home/guillaume/"
    owner: guillaume
    group: guillaume
    remote_src: yes
  become: yes
  tags:
    - frontend

- name: Clean up local archive
  file:
    path: "/tmp/frontend.tar.gz"
    state: absent
  delegate_to: localhost
  run_once: true
  tags:
    - frontend

- name: Clean up remote archive
  file:
    path: "/tmp/frontend.tar.gz"
    state: absent
  tags:
    - frontend

