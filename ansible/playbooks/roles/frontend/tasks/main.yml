- name: Installer Docker et Docker Compose
  become: true
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
    update_cache: true
    
- name: Create Frontend Directory
  file:
    path: /home/ubuntu/frontend
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Copy Frontend Files
  copy:
    src: "{{ playbook_dir }}/../../frontend/"
    dest: /home/ubuntu/frontend/
    owner: ubuntu
    group: ubuntu
    mode: preserve

- name: Exec Docker
  command: docker-compose up -d
  args:
    chdir: /home/ubuntu/frontend