- name: Installer Docker et Docker Compose
  become: true
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
    update_cache: true

- name: Démarrer et activer Docker
  become: true
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Ajouter l'utilisateur guillaume au groupe docker
  become: true
  ansible.builtin.user:
    name: guillaume
    groups: docker
    append: true

- name: Create Frontend Directory
  file:
    path: /home/guillaume/frontend
    state: directory
    owner: guillaume
    group: guillaume
    mode: u=rwX,g=rX,o=rX
    recurse: yes
  become: yes

- name: Copy Frontend Files
  copy:
    src: "/home/runner/work/projet-DevOps-gle/projet-DevOps-gle/frontend/"
    dest: /home/guillaume/frontend/
    owner: guillaume
    group: guillaume
    mode: 0644
  become: yes
  register: copy_result

- name: Templater le fichier docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /home/guillaume/frontend/docker-compose.yml
    owner: guillaume
    group: guillaume
    mode: '0644'
  notify: restart frontend


- name: Arrêter les services frontend existants
  ansible.builtin.shell: docker compose down
  args:
    chdir: /home/guillaume/frontend
  ignore_errors: true

- name: Nettoyer les anciennes images si nécessaire
  ansible.builtin.shell: docker image prune -f
  when: frontend_cleanup | default(false)

- name: Construire et lancer les services
  ansible.builtin.shell: |
    docker compose build {{ '--no-cache' if frontend_force_rebuild | default(false) else '' }}
    docker compose up -d
  args:
    chdir: /home/guillaume/frontend