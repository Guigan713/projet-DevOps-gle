---
- name: Récupérer l'IP du Load Balancer depuis dns_setup
  set_fact:
    lb_ip: "{{ hostvars['localhost']['lb_ip'] | default(hostvars[groups['swarm_managers'][0]]['lb_ip']) | default(lookup('env','LB_IP')) }}"

- name: Vérifier la propagation DNS des sous-domaines (Google resolver)
  shell: "dig +short {{ service.subdomain }}.{{ domain_name }} @8.8.8.8 A"
  loop: "{{ dns_services }}"
  loop_control:
    loop_var: service
  when:
    - inventory_hostname == groups['swarm_managers'][0]
    - service.enabled
  register: dns_check
  changed_when: false
  delegate_to: localhost
  run_once: true

- name: Attendre la propagation DNS si nécessaire
  ansible.builtin.pause:
    seconds: 30
    prompt: "Attente propagation DNS pour {{ dns_result.service.subdomain }}.{{ domain_name }}"
  loop: "{{ dns_check.results }}"
  loop_control:
    loop_var: dns_result
  when:
    - not dns_result.skipped | default(false)
    - dns_result.service.enabled
    - dns_result.stdout | default('') != lb_ip
    - dns_result.stdout | default('') != ''
  delegate_to: localhost
  run_once: true

- name: Copier la clé GCP DNS Challenge
  copy:
    src: "{{ gcp_credentials_file }}"
    dest: "{{ app_directory }}/gcp-service-account.json"
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
    mode: '0600'
  become: true
  when: gcp_credentials_file is defined and gcp_credentials_file | length > 0
  ignore_errors: false