# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible-community/schemas/main/f/ansible-tasks.json
---
- name: Install Google Cloud SDK repository key
  get_url:
    url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
    dest: /tmp/google-cloud-key.gpg
  become: true
  delegate_to: localhost
  run_once: true

- name: Add Google Cloud SDK GPG key
  shell: |
    gpg --dearmor < /tmp/google-cloud-key.gpg > /usr/share/keyrings/cloud.google.gpg
    rm /tmp/google-cloud-key.gpg
  become: true
  delegate_to: localhost
  run_once: true

- name: Add Google Cloud SDK repository
  lineinfile:
    path: /etc/apt/sources.list.d/google-cloud-sdk.list
    line: "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main"
    create: yes
  become: true
  delegate_to: localhost
  run_once: true

- name: Install Google Cloud SDK on localhost
  package:
    name: 
      - google-cloud-sdk
      - curl
      - dnsutils
    state: present
    update_cache: yes
  become: true
  delegate_to: localhost
  run_once: true

- name: Install Google Cloud SDK on remote servers  
  package:
    name: 
      - google-cloud-sdk
      - curl
      - dnsutils
    state: present
    update_cache: yes
  become: true

- name: Get external IP address
  uri:
    url: http://ipv4.icanhazip.com
    return_content: yes
  register: external_ip_result
  delegate_to: localhost
  run_once: true

- name: Set external IP fact
  set_fact:
    lb_ip: "{{ external_ip_result.content | trim }}"
  run_once: true

- name: Display detected external IP
  debug:
    msg: "External IP detected: {{ lb_ip }}"
  run_once: true

- name: Authenticate with Google Cloud
  shell: |
    gcloud auth activate-service-account --key-file={{ gcp_service_account_file }}
    gcloud config set project {{ gcp_project }}
    echo "Authenticated with project: {{ gcp_project }}"
  register: gcp_auth_result
  delegate_to: localhost
  run_once: true
  changed_when: false

- name: Verify DNS zone exists
  shell: |
    gcloud dns managed-zones describe {{ dns_zone_name }} --format="value(name)" 2>/dev/null || echo "NOT_FOUND"
  register: dns_zone_check
  delegate_to: localhost
  run_once: true
  changed_when: false

- name: Fail if DNS zone doesn't exist
  fail:
    msg: "DNS zone '{{ dns_zone_name }}' not found in project '{{ gcp_project }}'"
  when: dns_zone_check.stdout == "NOT_FOUND"
  run_once: true

- name: Create/Update DNS records for services
  shell: |
    rm -f transaction.yaml
    gcloud dns record-sets create {{ item.subdomain }}.{{ domain_name }}. \
      --zone={{ dns_zone_name }} \
      --type=A \
      --ttl={{ dns_ttl }} \
      --rrdatas={{ lb_ip }} 2>/dev/null

    if [ $? -ne 0 ]; then
      EXISTING=$(gcloud dns record-sets list --zone={{ dns_zone_name }} --name={{ item.subdomain }}.{{ domain_name }}. --type=A --format="get(ttl,rrdatas[0])")
      TTL=$(echo "$EXISTING" | awk '{print $1}')
      IP=$(echo "$EXISTING" | awk '{print $2}')
      if [ -n "$IP" ]; then
        gcloud dns record-sets transaction start --zone={{ dns_zone_name }}
        gcloud dns record-sets transaction remove "$IP" --name={{ item.subdomain }}.{{ domain_name }}. --type=A --ttl="$TTL" --zone={{ dns_zone_name }}
        gcloud dns record-sets transaction add {{ lb_ip }} --name={{ item.subdomain }}.{{ domain_name }}. --type=A --ttl={{ dns_ttl }} --zone={{ dns_zone_name }}
        gcloud dns record-sets transaction execute --zone={{ dns_zone_name }}
      fi
    fi
  loop: "{{ dns_services }}"
  when: item.enabled
  register: dns_result
  delegate_to: localhost
  run_once: true
  ignore_errors: true

- name: Display DNS management results
  debug:
    msg: |
      DNS Management Results:
      {% for result in dns_result.results %}
      {% if result.item is defined %}
        - {{ result.item.subdomain }}.{{ domain_name }}:
            Stdout: "{{ result.stdout | default('') | trim }}"
            Stderr: "{{ result.stderr | default('') | trim }}"
            RC: {{ result.rc | default(-1) }}
      {% endif %}
      {% endfor %}
  run_once: true

- name: Wait for DNS propagation
  pause:
    seconds: 15
    prompt: "Waiting 15 seconds for DNS propagation..."
  run_once: true

- name: Verify DNS records
  shell: "dig +short {{ item.subdomain }}.{{ domain_name }} @8.8.8.8 A"
  loop: "{{ dns_services }}"
  when: item.enabled
  register: dns_verification
  ignore_errors: true
  changed_when: false
  delegate_to: localhost
  run_once: true

- name: Display DNS verification results
  debug:
    msg: |
      DNS Verification Results:
      {% for result in dns_verification.results %}
      {% if result.item is defined %}
      - {{ result.item.subdomain }}.{{ domain_name }}: {{ result.stdout | default('❌ Not resolved yet') }}
      {% endif %}
      {% endfor %}
  run_once: true

- name: Display DNS summary
  debug:
    msg: |
      DNS Configuration Summary:
      - External IP: {{ lb_ip }}
      - DNS Zone: {{ dns_zone_name }}
      - Domain: {{ domain_name }}
      - Services configured:
      {% for service in dns_services %}
      {% if service.enabled %}
        * {{ service.subdomain }}.{{ domain_name }}
      {% endif %}
      {% endfor %}
  run_once: true
