- name: Installer Docker et Docker Compose
  become: true
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
    update_cache: true
    
- name: Create Backend Directory
  ansible.builtin.file:
    path: /home/ubuntu/backend
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Copy Backend Files (Dockerfile + docker-compose)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../backend/"
    dest: /home/ubuntu/backend/
    owner: ubuntu
    group: ubuntu
    mode: preserve

- name: Exec Compose for Backend
  ansible.builtin.command: docker-compose up -d
  args:
    chdir: /home/ubuntu/backend
