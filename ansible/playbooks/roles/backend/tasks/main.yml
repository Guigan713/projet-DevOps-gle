- name: Create backend archive locally
  archive:
    path: "{{ project_root }}/backend"
    dest: "/tmp/backend.tar.gz"
    format: gz
  delegate_to: localhost
  run_once: true
  tags:
    - backend

- name: Copy backend archive to server
  copy:
    src: "/tmp/backend.tar.gz"
    dest: "/tmp/backend.tar.gz"
  tags:
    - backend

- name: Create Backend Directory
  ansible.builtin.file:
    path: /home/guillaume/backend
    state: directory
    owner: guillaume
    group: guillaume
    mode: '0755'
    recurse: yes
  become: yes

- name: Extract backend files
  unarchive:
    src: "/tmp/backend.tar.gz"
    dest: "/home/guillaume/"
    owner: guillaume
    group: guillaume
    remote_src: yes
  become: yes
  tags:
    - backend

- name: Clean up local archive
  file:
    path: "/tmp/backend.tar.gz"
    state: absent
  delegate_to: localhost
  run_once: true
  tags:
    - backend

- name: Clean up remote archive
  file:
    path: "/tmp/backend.tar.gz"
    state: absent
  tags:
    - backend

