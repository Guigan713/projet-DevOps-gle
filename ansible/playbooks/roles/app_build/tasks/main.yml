---
- name: Afficher la variable source de clé GCP
  debug:
    msg: "gcp_credentials_file = {{ gcp_credentials_file }}, utilisateur cible = {{ ssh_user }}"

- name: Create application directory
  file:
    path: "{{ app_directory }}"
    state: directory
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
    mode: '0755'

- name: Create docker volumes directory
  file:
    path: "{{ app_directory }}/volumes"
    state: directory
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
    mode: '0755'

- name: Create build directory
  file:
    path: "{{ app_directory }}/build"
    state: directory
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
    mode: '0755'

- name: Create frontend directory
  file:
    path: "{{ app_directory }}/build/frontend"
    state: directory
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
    mode: '0755'

- name: Create backend directory
  file:
    path: "{{ app_directory }}/build/backend"
    state: directory
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
    mode: '0755'

- name: Créer dossier letsencrypt pour traefik
  file:
    path: "/opt/docker/letsencrypt"
    state: directory
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
    mode: '0700'

- name: Copy environment file
  template:
    src: templates/app.env.j2
    dest: "{{ app_directory }}/.env"
    owner: "{{ ssh_user }}"
    group: "{{ ssh_user }}"
    mode: '0600'

