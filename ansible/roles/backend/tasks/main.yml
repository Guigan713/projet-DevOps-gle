- name: Create Backend Directory
  file:
    path: /home/ubuntu/backend
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Copy Backend Files (Dockerfile + docker-compose)
  copy:
    src: "{{ playbook_dir }}/../../backend/"
    dest: /home/ubuntu/backend/
    owner: ubuntu
    group: ubuntu
    mode: preserve

- name: Exec Compose for Backend
  command: docker-compose up -d
  args:
    chdir: /home/ubuntu/backend
