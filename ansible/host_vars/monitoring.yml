# Pas besoin de node_exporter sur le serveur de monitoring
# ou configuration spéciale si nécessaire
node_exporter_enabled_collectors:
  - systemd
  - textfile
  - processes

prometheus_port: 9090
prometheus_retention: "15d"
prometheus_targets:
  - job_name: "node-exporter"
    targets:
      - "{{ frontend_private_ip }}:9100"
      - "{{ backend_private_ip }}:9100"
      - "{{ database_private_ip }}:9100"
      - "{{ monitoring_private_ip }}:9100"  # Self-monitoring
  
  - job_name: "mysql-exporter"
    targets:
      - "{{ database_private_ip }}:9104"
  
  - job_name: "nginx-exporter"
    targets:
      - "{{ hostvars['reverse-proxy']['ansible_host'] }}:9113"

# Configuration Grafana
grafana_port: 3000
grafana_admin_user: "admin"
grafana_admin_password: "{{ vault_grafana_password }}"
grafana_datasources:
  - name: "Prometheus"
    type: "prometheus"
    url: "http://localhost:9090"

# AlertManager
alertmanager_port: 9093
alertmanager_webhook_url: "{{ vault_slack_webhook }}"  # Notifications Slack

# Node Exporter local
node_exporter_port: 9100