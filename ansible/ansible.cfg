[defaults]
# Inventaire et configuration de base
inventory = inventories/swarm-hosts.ini
collections_path = /home/guillaume/.ansible/collections:/usr/share/ansible/collections:/usr/lib/python3/dist-packages/ansible_collections
host_key_checking = false
timeout = 30
gathering = smart
fact_caching = memory

# Utilisateur par défaut (sera override par ssh_user dans les vars)
remote_user = deploy

# Affichage et callbacks
colorized = true
stdout_callback = yaml
callbacks_enabled = profile_tasks

# Vault et sécurité
vault_password_file = .vault_pass

# Python interpreter
interpreter_python = /usr/bin/python3

# Clé SSH privée
private_key_file = /home/guillaume/.ssh/gcp-ssh-key

# Stratégie pour les erreurs
strategy = linear
forks = 5

# Gestion des logs
; log_path = ./logs/ansible.log

[ssh_connection]
# Configuration SSH avec votre proxy/bastion
ssh_args = -F ansible/ssh-config -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

# Alternative avec proxy
# ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o ConnectionAttempts=3 -o ProxyCommand="ssh -W %h:%p -q ubuntu@34.38.190.28"

# Optimisations SSH
pipelining = true
control_path = ~/.ansible/cp/ansible-%%h-%%p-%%r
retries = 3

[privilege_escalation]
become = true
become_method = sudo
become_user = root
become_ask_pass = false
