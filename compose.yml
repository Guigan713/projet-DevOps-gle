services:

  frontend:
    container_name: frontend--${ENVIRONMENT}
    image: frontend:${ENVIRONMENT}
    restart: unless-stopped
    build:
      context: ${DIR_FRONTEND}
      dockerfile: Dockerfile
      target: ${ENVIRONMENT}
    ports:
      # - "3000:80"
       - "3000:3000"  # For development (node serves on port 3000)
    environment:
      # REACT_APP_API_URL: http://backend--${ENVIRONMENT}:5000
      REACT_APP_API_URL: http://localhost:5000

    networks: 
      - app_network

    develop:
      watch:
        - action: sync
          path: ${DIR_FRONTEND}/src
          target: /app/src
        - action: sync+restart
          path: ${DIR_FRONTEND}
          target: /app
        - action: rebuild
          path: ${DIR_FRONTEND}/package.json

  backend:
    container_name: backend--${ENVIRONMENT}
    image: backend:${ENVIRONMENT}
    restart: unless-stopped
    build: 
      context: ${DIR_BACKEND}
      dockerfile: Dockerfile
      target: ${ENVIRONMENT}
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=${ENVIRONMENT}
      - DATABASE_HOST=database
      - DATABASE_USER=${DB_USER}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - DATABASE_NAME=${DB_NAME}
      - PORT=${PORT}
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      database:
        condition: service_healthy
      
  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus--${ENVIRONMENT}
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - app_network
      - monitoring_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana--${ENVIRONMENT}
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitoring_network

volumes:
  mysql_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  app_network:
    driver: bridge
  monitoring_network:
    driver: bridge
          