name: Deploy projet DevOps

on:
  # workflow_run:
  #   workflows: ["Test Workflow"]
  #   types:
  #     - completed
  push:
    branches:
      - main

jobs:
  deploy-ansible:
    name: Déployer avec Ansible
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
  
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3 community.docker
          ansible --version

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure SSH Key for GCP
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/gcp-ssh-key
          chmod 600 ~/.ssh/gcp-ssh-key

      - name: Configure SSH for Bastion & Private Access
        run: |
          cp ansible/ssh-config ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Run Ansible Playbook
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ansible/.vault_pass
          ansible-playbook -i ansible/inventories/swarm-hosts.ini ansible/playbooks/playbook.yml \
            --private-key ~/.ssh/gcp-ssh-key \
            --vault-password-file ansible/.vault_pass \
            -u deploy -v
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          GCP_SSH_KEY: ${{ secrets.GCP_SSH_KEY }}

