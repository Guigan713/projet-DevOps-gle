name: Deploy projet DevOps

on:
  # workflow_run:
  #   workflows: ["Test Workflow"]
  #   types:
  #     - completed
  push:
    branches:
      - main

jobs:
  configure-servers:
    name: Configure instances
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & build frontend
        run: |
          cd frontend 
          npm install
          npm run build

      - name: Install dependencies & build backend
        run: |
          cd backend 
          npm install
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
  
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3
          ansible --version

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure SSH Key for GCP
        run: |
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/gcp-ssh-key.pem
          chmod 600 ~/.ssh/gcp-ssh-key.pem

      - name: Configure SSH for Bastion Access
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/config << EOF
          Host bastion
            HostName 34.38.190.28
            User ubuntu
            IdentityFile ~/.ssh/gcp-ssh-key.pem
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ControlMaster auto
            ControlPath ~/.ssh/control-%r@%h:%p
            ControlPersist 5m
          
          Host 10.0.2.*
            User ubuntu
            IdentityFile ~/.ssh/gcp-ssh-key.pem
            ProxyJump bastion
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Test Connectivity
        run: |
          cd ansible
          echo "Testing bastion connection..."
          ansible reverse_proxy -m ping --private-key ~/.ssh/gcp-ssh-key.pem
          
          echo "Testing private network via bastion..."
          ansible frontend,backend,database,monitoring -m ping --private-key ~/.ssh/gcp-ssh-key.pem

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i ansible/inventories/hosts.ini ansible/playbooks/playbook.yml \
            --private-key ~/.ssh/gcp-ssh-key.pem \
            --vault-password-file <(echo $VAULT_PASSWORD) 
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}  

