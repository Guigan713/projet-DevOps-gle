name: Deploy projet DevOps

on:
  # workflow_run:
  #   workflows: ["Test Workflow"]
  #   types:
  #     - completed
  push:
    branches:
      - main

jobs:
  configure-servers:
    name: Configure instances
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & build frontend
        run: |
          cd frontend 
          npm install
          npm run build

      - name: Install dependencies & build backend
        run: |
          cd backend 
          npm install
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
  
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3
          ansible --version

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure SSH Key for GCP
        run: |
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > gcp-ssh-key.pem
          chmod 600 gcp-ssh-key.pem

      - name: Run Ansible Playbook
        run: |
          cd ansible
          ansible-playbook -i inventories/hosts.ini playbooks/playbook.yml \ 
            --private-key ../gcp-ssh-key.pem \
            --vault-password-file <(echo $VAULT_PASSWORD) 
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}  

