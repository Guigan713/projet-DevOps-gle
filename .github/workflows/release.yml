name: Release Versionning

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: googleapis/release-please-action@v4.2.0
        name: release-please action
        with:
          token: ${{ secrets.PAT_TOKEN }}
          release-type: simple